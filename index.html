<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>梦蝶之后 · Livy</title>
  <meta name="description" content="Livy 的水上博物馆：一艘多层花船，一只蝴蝶带你从广州、牛津、香港走到宾大，再到创作阁楼和船顶水镜台。After the Butterfly Dream: a floating museum where one butterfly guides you through the making of a self." />
  <meta property="og:title" content="梦蝶之后 · Livy" />
  <meta property="og:description" content="一艘驶向自我的花船。A Boat Toward Becoming Livy." />
  <meta name="theme-color" content="#0b1328" />
  <link rel="stylesheet" href="assets/vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
  <script type="importmap">
    { "imports": { "three": "./assets/vendor/three/three.module.js", "three/addons/": "./assets/vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="A pavilion on the sea"></canvas>

  <!-- data-nosnippet: keep button labels out of search snippets; the description above is used instead. -->
  <div data-nosnippet>
    <section id="intro" class="intro">
      <div class="intro-inner">
        <p class="kicker" id="kicker"></p>
        <h1 class="title"><span id="title"></span><i class="seal">Livy</i></h1>
        <p class="subtitle" id="subtitle"></p>
        <p class="tagline" id="tagline"></p>
        <button id="btn-board" class="ticket">
          <span class="ticket-main"><b data-i18n="board">登船</b><small id="t-vessel"></small><small id="t-route"></small><small id="t-dest"></small></span>
          <span class="ticket-stub">No.<br />0001</span>
        </button>
        <p class="looks-label" data-i18n="pickLook"></p>
        <div id="looks" class="looks"></div>
        <button id="btn-direct" class="link" data-i18n="direct"></button>
      </div>
    </section>

    <p id="caption" class="caption" aria-live="polite"></p>
    <button id="btn-skip" class="pill skip" data-i18n="skip" hidden></button>

    <header id="deck-card" class="deck-card" hidden>
      <p class="kicker" id="deck-kicker"></p>
      <h2 id="deck-name"></h2>
      <p class="question" id="deck-question"></p>
      <p class="intro-text" id="deck-intro"></p>
    </header>

    <nav id="decks" class="decks" aria-label="decks" hidden></nav>

    <nav class="top" aria-label="controls">
      <button id="btn-out" class="pill" data-i18n="outside" hidden></button>
      <button id="btn-in" class="pill" data-i18n="inside" hidden></button>
      <button id="btn-ride" class="pill" data-i18n="ride" hidden></button>
      <button id="btn-cv" class="pill" data-i18n="cv" hidden></button>
      <a id="btn-chris" class="pill" target="_blank" rel="noopener"><span class="full" data-i18n="chris"></span><span class="short">Chris</span> ↗</a>
      <button id="btn-sound" class="pill icon" data-i18n-title="sound">♪</button>
      <button id="btn-lang" class="pill" data-i18n="lang"></button>
    </nav>

    <aside id="panel" class="panel" hidden>
      <button id="p-close" class="close" data-i18n-title="close">×</button>
      <p class="kicker" id="p-kicker"></p>
      <h3 id="p-title"></h3>
      <div id="p-body"></div>
    </aside>

    <div id="bubble" class="bubble" hidden></div>
    <div id="tip" class="tip" hidden></div>
    <p id="hint" class="hint" hidden></p>
  </div>
  <div id="fade" class="fade"></div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
